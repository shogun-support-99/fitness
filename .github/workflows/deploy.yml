name: Test and deploy

# Every push to main redeploys automatically — no manual publish step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run app logic tests
        run: node --test "tests/*.test.js"

      - name: Verify every module parses
        run: |
          set -x
          fail=0
          for f in $(find app assets scripts -name '*.js'); do
            if ! node --check "$f" 2>/tmp/err; then
              echo "SYNTAX ERROR in $f"; cat /tmp/err; fail=1
            fi
          done
          exit $fail

      - name: Verify local asset links resolve
        run: |
          set -x
          node scripts/check-links.mjs

      # Gym Visual 180x180 GIFs/stills ship under a media licence held by the
      # app operator, with attribution retained on every record. They live only
      # in their approved directory; no remote/raw-upstream or premium media is
      # allowed anywhere.
      - name: Assert media licences and attribution
        run: |
          set -xeuo pipefail
          fail=0

          echo "-- scanning the dataset catalogue for remote or raw-upstream media fields --"
          # The required attribution string legitimately contains the Gym Visual
          # URL, so only raw upstream field names are banned at file scope; media
          # paths are validated per record as local media/gymvisual/* paths by
          # the unit tests and by the directory checks below.
          if grep -rioE 'gif_url|media_id|/images/|/videos/' app/data/exercises-index.json app/data/steps.*.json; then
            echo "::error::remote or raw-upstream media reference found in the dataset catalogue"
            fail=1
          else
            echo "   clean: catalogue records use local licensed gymvisual paths only"
          fi

          echo "-- asserting every dataset record carries local licensed gymvisual media --"
          if grep -rioE '[^"]*"media":\{"provider":"gymvisual"' app/data/exercises-index.json >/dev/null; then
            echo "   ok: gymvisual media provider present"
          else
            echo "::error::dataset records missing the gymvisual media provider"
            fail=1
          fi
          if git ls-files app/media/gymvisual | grep -viE '\.(gif|jpg)$'; then
            echo "::error::non-GIF/JPG file in gymvisual media directory"
            fail=1
          fi

          echo "-- asserting the retired RepDB catalogue leaves no residue --"
          if git ls-files | grep -i 'repdb'; then
            echo "::error::RepDB files are no longer part of the app"
            fail=1
          else
            echo "   clean: built-in library and MIT dataset only"
          fi

          echo "-- allowing binary exercise media only in licensed directories --"
          if git ls-files | grep -iE '\.(gif|jpe?g|png|webp|mp4|webm|mov)$' | grep -viE '^(assets/img/|app/icons/|app/media/gymvisual/)' ; then
            echo "::error::unexpected binary media outside approved artwork directories"
            fail=1
          fi
          if git ls-files | grep -i 'premium-samples'; then
            echo "::error::evaluation-only premium media must not be committed"
            fail=1
          fi

          echo "-- asserting attribution and provenance are present --"
          test -f NOTICE || { echo "::error::NOTICE file missing"; fail=1; }
          grep -q 'hasaneyldrm/exercises-dataset' NOTICE || { echo "::error::NOTICE missing upstream credit"; fail=1; }
          grep -q 'Gym Visual' NOTICE || { echo "::error::NOTICE missing Gym Visual media notice"; fail=1; }
          grep -q 'Hasan Emir' app/data/catalogue-meta.json || { echo "::error::generated metadata lost the MIT copyright notice"; fail=1; }
          grep -q 'Gym Visual' app/data/catalogue-meta.json || { echo "::error::catalogue metadata lost the Gym Visual media notice"; fail=1; }

          exit $fail

  android-build-release:
    name: Build & release Android APK
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          ls "${ANDROID_HOME}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        run: |
          set -euo pipefail
          # No third-party action here: the setup-* actions built for Node 20 are
          # forced onto Node 24 on the current runner image and crash instantly.
          # The runner may already ship a usable Gradle; otherwise install the
          # exact version the project's wrapper declares into a writable path.
          GRADLE_VERSION=8.14.6
          if command -v gradle >/dev/null 2>&1 \
             && gradle --version 2>/dev/null | grep -qx "Gradle ${GRADLE_VERSION}"; then
            echo "Using preinstalled Gradle ${GRADLE_VERSION}"
            exit 0
          fi
          cd "${RUNNER_TEMP}"
          curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          python3 -c "import zipfile; zipfile.ZipFile('gradle.zip').extractall('gradle-dist')"
          echo "GRADLE_HOME=${RUNNER_TEMP}/gradle-dist/gradle-${GRADLE_VERSION}" >> "${GITHUB_ENV}"
          echo "${RUNNER_TEMP}/gradle-dist/gradle-${GRADLE_VERSION}/bin" >> "${GITHUB_PATH}"
          echo "Installed Gradle ${GRADLE_VERSION} from the distribution archive."

      - name: Show toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=${ANDROID_HOME}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list_installed || true

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          gradle assembleRelease --no-daemon \
            -PironlogVersionCode=${{ github.run_number }} \
            -PironlogVersionName=1.0.${{ github.run_number }}

      - name: Verify the APK contains the whole offline web app
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "${APK}" || { echo "::error::release APK was not produced"; exit 1; }
          # The shell is only useful if the bundled web app came with it. AGP
          # accepts a staged directory as an asset source without inheriting the
          # task that fills it, so a wiring regression ships an APK that opens to
          # a blank WebView and fails nothing. Fail loudly instead.
          #
          # Every asset in an APK lives under the top-level assets/ directory, so
          # src/main/assets/app/index.html is the member assets/app/index.html.
          for required in assets/app/index.html assets/app/js/main.js \
                          assets/app/css/app.css assets/assets/css/tailwind.css \
                          assets/fonts/Geist-Variable.woff2; do
            if ! python3 - "$APK" "$required" <<'PY'
          import sys, zipfile
          apk, member = sys.argv[1], sys.argv[2]
          names = zipfile.ZipFile(apk).namelist()
          sys.exit(0 if member in names else 1)
          PY
            then
              echo "::error::APK is missing bundled asset '$required'"
              exit 1
            fi
            echo "  present: $required"
          done
          # The exercise library and its licensed demonstration media are what
          # make this build large; an APK without them is not the app.
          MEDIA=$(python3 - "$APK" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          print(sum(1 for n in names if n.startswith("assets/app/media/gymvisual/")))
          PY
          )
          if [ "${MEDIA}" -lt 2000 ]; then
            echo "::error::APK carries only ${MEDIA} gymvisual media files; the library did not ship"
            exit 1
          fi
          echo "  present: ${MEDIA} gymvisual exercise media files"
          BYTES=$(stat -c%s "${APK}")
          if [ "${BYTES}" -lt $((50 * 1024 * 1024)) ]; then
            echo "::error::APK is only ${BYTES} bytes; the exercise library and media did not ship"
            exit 1
          fi
          echo "APK is $((BYTES / 1024 / 1024)) MB and contains the full web app."

      - name: Stage release assets
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ironlog.apk
          cat > dist/version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "notes": "IronLog v1.0.${{ github.run_number }} — latest build from commit ${{ github.sha }}"
          }
          EOF

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/ironlog.apk,dist/version.json"
          tag: "v1.0.${{ github.run_number }}"
          name: "IronLog v1.0.${{ github.run_number }}"
          allowUpdates: true
          replaceArtifacts: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Every deploy gets its own service-worker cache name and visible build
      # identity. Without this, a returning visitor can keep the previous shell
      # until the HTTP cache expires, and "did my update ship?" is unanswerable.
      - name: Stamp build identity
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA::12}"
          built="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          sed -i -E "s/const CACHE = \"[^\"]*\";/const CACHE = \"ironlog-shell-${short}\";/" app/sw.js
          cat > app/js/version.js <<EOF
          /**
           * IronLog - build identity (generated by the deploy workflow).
           *
           * Do not edit by hand in a deployed build; the local source value is
           * "dev" until a deploy stamps it.
           */

          export const VERSION = "${short}";
          export const BUILT_AT = "${built}";
          EOF
          grep -q "ironlog-shell-${short}" app/sw.js
          grep -q "\"${short}\"" app/js/version.js
          echo "Stamped build ${short} at ${built}"

      # GitHub Pages must be enabled once, by a human, in the repository UI:
      # the REST endpoint that creates a Pages site rejects both user tokens and
      # the workflow token with "Resource not accessible by integration" on this
      # account. This step tries anyway, and if it cannot, it stops with a
      # precise instruction rather than letting configure-pages fail opaquely.
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          api="https://api.github.com/repos/$REPO/pages"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          code=$(curl -s -o /tmp/pages.json -w '%{http_code}' "${auth[@]}" "$api")
          if [ "$code" = "200" ]; then
            echo "GitHub Pages is already enabled."
            grep -o '"html_url":"[^"]*"' /tmp/pages.json | head -1 || true
            exit 0
          fi

          echo "Pages is not enabled yet (GET returned HTTP $code). Attempting to enable it..."
          code=$(curl -s -o /tmp/enable.json -w '%{http_code}' -X POST "${auth[@]}" \
                 -d '{"build_type":"workflow"}' "$api")
          if [ "$code" = "201" ]; then
            echo "GitHub Pages enabled with Source: GitHub Actions."
            exit 0
          fi

          echo "Automatic enablement returned HTTP $code:"
          cat /tmp/enable.json 2>/dev/null | head -c 500; echo
          echo "::error title=One-time manual step required::GitHub Pages is not enabled on this repository, and the API refuses to enable it automatically. Open https://github.com/$REPO/settings/pages and set 'Build and deployment' -> Source to 'GitHub Actions'. Then re-run this workflow from the Actions tab; every later push to main will deploy on its own."
          exit 1

      - name: Set up Pages
        uses: actions/configure-pages@v5

      # The Android keystore and build tooling must never be published to
      # GitHub Pages. Stage only the public site files.
      - name: Stage public site files (exclude Android build tooling)
        run: rm -rf android

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
