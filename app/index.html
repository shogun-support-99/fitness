<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IronLog — Strength training log</title>
    <meta
      name="description"
      content="IronLog is an offline-first strength training log. Track exercises, sets, volume, rest and personal records. No account, no server, no tracking."
    />
    <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="./" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../assets/img/logo.svg" />

    <!-- Both faces are self-hosted under the SIL Open Font License, so the
         page makes no third-party request. Preloading keeps weights, reps and
         timers from shifting when the real faces arrive. -->
    <link rel="preload" href="../fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/kinetic.css" />
    <link rel="stylesheet" href="./css/hevy.css" />
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <script>
      // Apply the saved appearance before first paint. New logs use the bright,
      // blue-accented product theme; existing light/dark preferences remain intact.
      try {
        const saved = JSON.parse(localStorage.getItem("ironlog.v1") || "null");
        const theme = saved?.settings?.theme || "light";
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" src="./js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#view-outlet">Skip to content</a>

    <div class="shell">
      <aside class="sidebar" aria-label="Primary">
        <a class="brand" href="#/home" aria-label="IronLog home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M6 12v8M10 8v16M22 8v16M26 12v8M10 16h12" />
            </svg>
          </span>
          <span class="brand-name">IronLog</span>
        </a>

        <nav class="nav">
          <span class="nav-active-line" aria-hidden="true"></span>
          <a class="nav-item" data-route="home" href="#/home" aria-label="Home">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5" /></svg>
            </span>
            Home
          </a>
          <a class="nav-item" data-route="workout" href="#/workout" aria-label="Workout">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" /></svg>
            </span>
            Workout
          </a>
          <a class="nav-item" data-route="library" href="#/library" aria-label="Exercises">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 5.5h7v13H4zM13 5.5h7v13h-7z" /></svg>
            </span>
            Exercises
          </a>
          <a class="nav-item" data-route="stats" href="#/stats" aria-label="Profile">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8c.7-4 3.1-6 7-6s6.3 2 7 6" /></svg>
            </span>
            Profile
          </a>
          <a class="nav-item nav-item-secondary" data-route="history" href="#/history" aria-label="History">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4.5V10h5.5M12 7.5V12l3 1.8" /></svg>
            </span>
            History
          </a>
          <a class="nav-item nav-item-secondary" data-route="settings" href="#/settings" aria-label="Settings">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm8.4-3.2 1.9-1.5-1.9-3.3-2.3.7a7.6 7.6 0 0 0-1.6-.9L14.1 4h-4l-.4 2.5c-.6.2-1.1.5-1.6.9l-2.3-.7-1.9 3.3 1.9 1.5a7.9 7.9 0 0 0 0 1.8L3.9 15l1.9 3.3 2.3-.7c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.3.7 1.9-3.3-1.9-1.5a7.9 7.9 0 0 0 0-1.8Z" /></svg>
            </span>
            Settings
          </a>
        </nav>

        <div class="sidebar-foot">
          <a class="link-muted" href="../" aria-label="Landing page">Landing page</a>
          <p class="storage-note">Stored in this browser</p>
        </div>
      </aside>

      <div class="workspace">
        <header class="app-topbar">
          <a class="topbar-context" href="#/home" aria-label="IronLog home">
            <svg class="topbar-mark" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M6 12v8M10 8v16M22 8v16M26 12v8M10 16h12" />
            </svg>
            <span>IronLog</span>
          </a>
          <div class="topbar-actions">
            <span class="local-status"><span aria-hidden="true"></span>Saved locally</span>
            <a class="topbar-about" href="../">About <span aria-hidden="true">↗</span></a>
            <a class="topbar-settings" href="#/settings" aria-label="Open settings">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm8.4-3.2 1.9-1.5-1.9-3.3-2.3.7a7.6 7.6 0 0 0-1.6-.9L14.1 4h-4l-.4 2.5c-.6.2-1.1.5-1.6.9l-2.3-.7-1.9 3.3 1.9 1.5a7.9 7.9 0 0 0 0 1.8L3.9 15l1.9 3.3 2.3-.7c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.3.7 1.9-3.3-1.9-1.5a7.9 7.9 0 0 0 0-1.8Z" /></svg>
            </a>
          </div>
        </header>
        <main class="main animate-rise" id="view-outlet" tabindex="-1"></main>
      </div>

    </div>

    <div id="toast-host" aria-live="polite"></div>

    <!--
      Celebration announcer. The stamp and ray burst in motion.js are visual;
      this is the same event for assistive tech. Polite, not assertive: a new
      personal record is worth interrupting a rest timer for, not worth
      interrupting a screen reader mid-word.
    -->
    <div id="ironlog-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
