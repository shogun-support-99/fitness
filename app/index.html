<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-src 'none'; form-action 'self'"
    />
    <title>IronLog — Strength training log</title>
    <meta
      name="description"
      content="IronLog is an offline-first strength training log. Track exercises, sets, volume, rest and personal records from a 1,316-exercise library. No account, no server, no tracking."
    />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IronLog" />
    <meta property="og:title" content="IronLog — Strength training log" />
    <meta
      property="og:description"
      content="Track exercises, sets, volume, rest and personal records offline. No account, no server, no tracking."
    />
    <meta property="og:url" content="https://shogun-support-99.github.io/fitness/app/" />
    <meta property="og:image" content="https://shogun-support-99.github.io/assets/img/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://shogun-support-99.github.io/fitness/app/" />
    <link rel="sitemap" type="application/xml" href="../sitemap.xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Both faces are self-hosted under the SIL Open Font License, so the
         page makes no third-party request. Figtree is the Hevy APK's own UI
         face (assets/fonts/Figtree-{Regular,Medium,SemiBold,Bold}.ttf) and the
         same variable file IronLog already serves the landing page, so the app
         borrows it rather than inventing a lookalike. Preloading keeps weights,
         reps and timers from shifting when the real faces arrive. -->
    <link rel="preload" href="../fonts/Figtree-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/oled.css" />
    <script src="./js/theme-init.js"></script>
    <script type="module" src="./js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#view-outlet">Skip to content</a>

    <div class="update-banner" id="update-banner" role="status" hidden>
      <span class="update-banner-dot" aria-hidden="true"></span>
      <span class="update-banner-text">A new version of IronLog is ready.</span>
      <button class="btn btn-small btn-primary" type="button" data-action="apply-update">Reload to update</button>
      <button
        class="icon-btn update-banner-close"
        type="button"
        data-action="dismiss-update"
        aria-label="Dismiss update notice"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>

    <!-- Phone-first Hevy shell: a single fixed column, one top bar, one
         scrolling outlet, one bottom tab bar. `.shell` is the layout root the
         app CSS already measures, so keeping the class keeps every motion and
         scroll behaviour in app.css/motion.js working unchanged. -->
    <div class="shell app-shell">
      <header class="app-topbar">
        <a class="topbar-mark-link" href="#/home" aria-label="IronLog home">
          <span class="topbar-mark">
            <svg class="logo-mark-small" viewBox="0 0 24 24" aria-hidden="true">
              <defs>
                <linearGradient id="logograd-small" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#64b5f6" />
                  <stop offset="100%" stop-color="#2196f3" />
                </linearGradient>
              </defs>
              <path d="M12 2c-3.314 0-6 2.686-6 6s2.686 6 6 6 6-2.686 6-6-2.686-6-6-6Zm0 1.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z" fill="url(#logograd-small)" />
              <path d="M12 2v6m0 6v6M12 14v6m0 0v2m0-14V2" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
            </svg>
          </span>
          <span class="topbar-title" data-topbar-title>IronLog</span>
        </a>
        <div class="topbar-actions">
          <span class="local-status"><span class="status-dot" aria-hidden="true"></span><span data-local-label>Saved</span></span>
          <a class="topbar-settings" href="#/settings" aria-label="Open settings" data-route="settings">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm8.4-3.2 1.9-1.5-1.9-3.3-2.3.7a7.6 7.6 0 0 0-1.6-.9L14.1 4h-4.2l-1.9 2.7a7.6 7.6 0 0 0-1.6.9l-1.9-2.7h-2.1l-1.9 3.3 1.9 1.5a3.2 3.2 0 0 0 0 6.4l1.9 1.5 1.9-1.5a3.2 3.2 0 0 0 0-6.4l1.9-1.5z" /></svg>
          </a>
        </div>
      </header>

      <main class="main" id="view-outlet" tabindex="-1"></main>

      <!-- Hevy-style bottom tab bar: Home · Workout · History · Profile.
           The glider span is measured from layout in main.js, so it must stay
           inside .nav. -->
      <nav class="nav tabbar" aria-label="Primary">
        <span class="nav-glider" aria-hidden="true"></span>
        <a class="nav-item tabbar-item" data-route="home" href="#/home" title="Home">
          <span class="nav-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5" /></svg>
          </span>
          <span class="nav-text">Home</span>
        </a>
        <a class="nav-item tabbar-item" data-route="workout" href="#/workout" title="Workout">
          <span class="nav-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" /></svg>
          </span>
          <span class="nav-text">Workout</span>
        </a>
        <a class="nav-item tabbar-item" data-route="history" href="#/history" title="History">
          <span class="nav-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4.5V10h5.5M12 7.5V12l3 1.8" /></svg>
          </span>
          <span class="nav-text">History</span>
        </a>
        <a class="nav-item tabbar-item" data-route="stats" href="#/stats" title="Profile">
          <span class="nav-icon" aria-hidden="true">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2" /></svg>
          </span>
          <span class="nav-text">Profile</span>
        </a>
      </nav>
    </div>

    <div class="mini-player" id="mini-player" hidden>
      <a class="mini-resume" href="#/workout" aria-label="Resume active workout">
        <span class="mini-live" aria-hidden="true"></span>
        <span class="mini-copy">
          <span class="mini-name" data-mini-name>Workout in progress</span>
          <span class="mini-meta"><span data-mini-meta>0 sets logged</span> &middot; <span class="mini-elapsed" data-mini-elapsed>00:00</span></span>
        </span>
        <span class="mini-open">Resume</span>
      </a>
      <button class="mini-discard" data-action="discard-workout" aria-label="Discard workout">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>

    <div id="toast-host" aria-live="polite"></div>

    <!-- Celebration announcer for assistive tech -->
    <div id="ironlog-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
