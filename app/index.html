<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>IronLog — Strength training log</title>
    <meta
      name="description"
      content="IronLog is an offline-first strength training log. Track exercises, sets, volume, rest and personal records from a 1,316-exercise library. No account, no server, no tracking."
    />
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d120e" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IronLog" />
    <meta property="og:title" content="IronLog — Strength training log" />
    <meta
      property="og:description"
      content="Track exercises, sets, volume, rest and personal records offline. No account, no server, no tracking."
    />
    <meta property="og:url" content="https://shogun-support-99.github.io/fitness/app/" />
    <meta property="og:image" content="https://shogun-support-99.github.io/fitness/assets/img/og-cover.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://shogun-support-99.github.io/fitness/app/" />
    <link rel="sitemap" type="application/xml" href="../sitemap.xml" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Both faces are self-hosted under the SIL Open Font License, so the
         page makes no third-party request. Preloading keeps weights, reps and
         timers from shifting when the real faces arrive. -->
    <link rel="preload" href="../fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="../fonts/GeistMono-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../assets/css/tailwind.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <script>
      // Apply the saved appearance before first paint. Light is the crafted
      // default; a saved dark preference wins.
      try {
        const saved = JSON.parse(localStorage.getItem("ironlog.v1") || "null");
        const theme = saved?.settings?.theme || "light";
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script type="module" src="./js/main.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#view-outlet">Skip to content</a>

    <div class="update-banner" id="update-banner" role="status" hidden>
      <span class="update-banner-dot" aria-hidden="true"></span>
      <span class="update-banner-text">A new version of IronLog is ready.</span>
      <button class="btn btn-small btn-primary" type="button" data-action="apply-update">Reload to update</button>
      <button
        class="icon-btn update-banner-close"
        type="button"
        data-action="dismiss-update"
        aria-label="Dismiss update notice"
      >
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" /></svg>
      </button>
    </div>

    <div class="shell">
      <aside class="sidebar" id="app-sidebar" aria-label="Primary">
        <div class="sidebar-head">
          <a class="brand" href="#/home" aria-label="IronLog home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 64 64" focusable="false">
                <path
                  fill="currentColor"
                  fill-rule="evenodd"
                  d="M58.31 22.42A28 28 0 1 1 41.58 5.69L58.31 22.42ZM41 32a9 9 0 1 1-18 0 9 9 0 1 1 18 0Z"
                />
                <path fill="#f6e016" d="M41.58 5.69 58.31 22.42 54.07 26.66 37.34 9.93Z" />
              </svg>
            </span>
            <span class="brand-copy">
              <span class="brand-name">IronLog</span>
              <span class="brand-tag">Strength log</span>
            </span>
          </a>
          <button
            class="sidebar-toggle"
            type="button"
            data-action="toggle-sidebar"
            aria-label="Collapse sidebar"
            aria-controls="app-sidebar"
            aria-expanded="true"
            title="Collapse sidebar"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 5l-7 7 7 7" />
            </svg>
          </button>
        </div>

        <nav class="nav">
          <span class="nav-glider" aria-hidden="true"></span>
          <span class="nav-label">Train</span>
          <a class="nav-item" data-route="home" href="#/home" title="Home">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5M5.5 9.5V20h13V9.5" /></svg>
            </span>
            <span class="nav-text">Home</span>
          </a>
          <a class="nav-item" data-route="workout" href="#/workout" title="Workout">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 9v6M7 7v10M17 7v10M20 9v6M7 12h10" /></svg>
            </span>
            <span class="nav-text">Workout</span>
          </a>

          <span class="nav-label">Library</span>
          <a class="nav-item" data-route="library" href="#/library" title="Exercises">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M4 5.5h7v13H4zM13 5.5h7v13h-7z" /></svg>
            </span>
            <span class="nav-text">Exercises</span>
          </a>

          <span class="nav-label">You</span>
          <a class="nav-item" data-route="history" href="#/history" title="History">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1M3.5 4.5V10h5.5M12 7.5V12l3 1.8" /></svg>
            </span>
            <span class="nav-text">History</span>
          </a>
          <a class="nav-item" data-route="stats" href="#/stats" title="Profile">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8c.7-4 3.1-6 7-6s6.3 2 7 6" /></svg>
            </span>
            <span class="nav-text">Profile</span>
          </a>
          <a class="nav-item nav-item-settings" data-route="settings" href="#/settings" title="Settings">
            <span class="nav-icon" aria-hidden="true">
              <svg class="icon" viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm8.4-3.2 1.9-1.5-1.9-3.3-2.3.7a7.6 7.6 0 0 0-1.6-.9L14.1 4h-4l-.4 2.5c-.6.2-1.1.5-1.6.9l-2.3-.7-1.9 3.3 1.9 1.5a7.9 7.9 0 0 0 0 1.8L3.9 15l1.9 3.3 2.3-.7c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.3.7 1.9-3.3-1.9-1.5a7.9 7.9 0 0 0 0-1.8Z" /></svg>
            </span>
            <span class="nav-text">Settings</span>
          </a>
        </nav>

        <div class="sidebar-foot">
          <span class="local-status"><span class="status-dot" aria-hidden="true"></span>Saved in this browser</span>
          <a class="link-muted" href="../">About IronLog <span aria-hidden="true">↗</span></a>
        </div>
      </aside>

      <div class="workspace">
        <header class="app-topbar">
          <a class="topbar-context" href="#/home" aria-label="IronLog home">
            <svg class="topbar-mark" viewBox="0 0 64 64" aria-hidden="true">
              <path
                fill="currentColor"
                fill-rule="evenodd"
                d="M58.31 22.42A28 28 0 1 1 41.58 5.69L58.31 22.42ZM41 32a9 9 0 1 1-18 0 9 9 0 1 1 18 0Z"
              />
              <path fill="#f6e016" d="M41.58 5.69 58.31 22.42 54.07 26.66 37.34 9.93Z" />
            </svg>
            <span>IronLog</span>
          </a>
          <div class="topbar-actions">
            <span class="local-status"><span class="status-dot" aria-hidden="true"></span>Saved</span>
            <a class="topbar-about" href="../">About <span aria-hidden="true">↗</span></a>
            <a class="topbar-settings" href="#/settings" aria-label="Open settings" data-route="settings">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Zm8.4-3.2 1.9-1.5-1.9-3.3-2.3.7a7.6 7.6 0 0 0-1.6-.9L14.1 4h-4l-.4 2.5c-.6.2-1.1.5-1.6.9l-2.3-.7-1.9 3.3 1.9 1.5a7.9 7.9 0 0 0 0 1.8L3.9 15l1.9 3.3 2.3-.7c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.3.7 1.9-3.3-1.9-1.5a7.9 7.9 0 0 0 0-1.8Z" /></svg>
            </a>
          </div>
        </header>
        <main class="main" id="view-outlet" tabindex="-1"></main>
      </div>
    </div>

    <div id="toast-host" aria-live="polite"></div>

    <!--
      Celebration announcer. The stamp and ray burst in motion.js are visual;
      this is the same event for assistive tech. Polite, not assertive: a new
      personal record is worth interrupting a rest timer for, not worth
      interrupting a screen reader mid-word.
    -->
    <div id="ironlog-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
