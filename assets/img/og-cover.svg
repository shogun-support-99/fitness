<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="IronLog — Track every set. Get stronger.">
  <defs>
    <style>
      @font-face {
        font-family: "Geist";
        src: url("../../fonts/Geist-Variable.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
      }
      .ink { fill: #0f2a1d; }
      .muted { fill: #5f655b; }
      .word { font-family: "Geist", sans-serif; font-weight: 640; letter-spacing: -0.03em; }
      .display { font-family: "Geist", sans-serif; font-weight: 620; font-size: 94px; letter-spacing: -0.045em; }
      .sub { font-family: "Geist", sans-serif; font-weight: 400; font-size: 25px; }
      .mono { font-family: "Geist Mono", monospace; font-size: 16px; letter-spacing: 0.14em; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#f2f1ec"/>

  <!-- wordmark -->
  <g transform="translate(72 64)">
    <g transform="scale(0.72)">
      <path fill="#0f2a1d" fill-rule="evenodd" d="M58.31 22.42A28 28 0 1 1 41.58 5.69L58.31 22.42ZM41 32a9 9 0 1 1-18 0 9 9 0 1 1 18 0Z"/>
      <path fill="#f6e016" d="M41.58 5.69 58.31 22.42 54.07 26.66 37.34 9.93Z"/>
    </g>
    <text x="60" y="34" class="ink word" font-size="30">IronLog</text>
  </g>

  <!-- headline -->
  <path d="M72 190h10v34l-10 10z" fill="#f6e016"/>
  <text x="106" y="226" class="ink display">Track every</text>
  <text x="106" y="320" class="ink display">set. Get stronger.</text>

  <text x="108" y="386" class="muted sub">A private, offline-first training log.</text>
  <text x="108" y="422" class="muted sub">Last week's numbers, always in view.</text>

  <!-- footer facts -->
  <line x1="72" y1="524" x2="792" y2="524" stroke="#d8d6cc"/>
  <g transform="translate(72 562)">
    <text class="ink mono">1,316 EXERCISES</text>
    <text x="214" class="ink mono">2,632 GIFS</text>
    <text x="400" class="ink mono">NO ACCOUNT</text>
    <text x="562" class="ink mono">NO TRACKING</text>
  </g>

  <!-- plate motif -->
  <g transform="translate(806 152) scale(5.9)" opacity="0.98">
    <path fill="#0f2a1d" fill-rule="evenodd" d="M58.31 22.42A28 28 0 1 1 41.58 5.69L58.31 22.42ZM41 32a9 9 0 1 1-18 0 9 9 0 1 1 18 0Z"/>
    <path fill="#f6e016" d="M41.58 5.69 58.31 22.42 54.07 26.66 37.34 9.93Z"/>
  </g>
</svg>
