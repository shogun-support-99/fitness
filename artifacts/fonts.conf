<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The VM has no /etc/fonts, which makes Skia abort. Point fontconfig at the
     fonts extracted from Ubuntu's packages into the private sysroot instead. -->
<fontconfig>
  <dir>/tmp/sysroot/usr/share/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
